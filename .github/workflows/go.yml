# Имя файла сохранено: на него ссылается бейдж в Readme.md.
name: 'Go package'

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Один и тот же шелл на всей матрице. По умолчанию Windows-раннер исполняет
# `run:` через PowerShell, а Linux и macOS — через bash, и аргументы вида
# `-coverprofile=coverage.out` разбираются по-разному: Go получал `.out`
# отдельным аргументом и пытался собрать его как пакет.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -v ./...
      - run: go vet ./...
      # -shuffle=on обязателен: он же служит доказательством, что глобального
      # состояния в пакете нет. Профиль покрытия в файл не пишется — его никто
      # никуда не выгружал, а процент печатает и обычный -cover. С -race режим
      # покрытия и так становится atomic, задавать его отдельно незачем.
      - run: go test -race -shuffle=on -cover ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # Парсер фаззится на каждом пуше, коротко. Всё, что фаззер отверг, оседает в
  # testdata/fuzz/ и с этого момента проигрывается обычным прогоном тестов.
  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -run Fuzz -fuzz FuzzParse -fuzztime 30s
      - run: go test -run Fuzz -fuzz 'FuzzRoundTrip$' -fuzztime 30s

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
